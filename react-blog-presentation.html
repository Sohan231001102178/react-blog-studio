<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Studio (CRUD) — Interactive Presentation & Architecture Showcase</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone for Instant Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-dark: #0b0f19;
      --bg-card: rgba(18, 24, 38, 0.85);
      --bg-card-hover: rgba(28, 36, 56, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.35);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --accent-purple: #8b5cf6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-1: #f8fafc;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --shadow-glow: 0 0 35px rgba(99, 102, 241, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      color: var(--text-1);
      line-height: 1.6;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.12) 0%, transparent 45%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Top Showcase Bar */
    .showcase-header {
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 0.85rem 2rem;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(6, 182, 212, 0.15));
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.775rem;
      font-weight: 700;
      color: #c7d2fe;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-title-box h1 {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .header-title-box p {
      font-size: 0.75rem;
      color: var(--text-2);
      margin-top: 2px;
    }

    /* Tab Navigation */
    .nav-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.25rem;
      border-radius: 9999px;
      border: 1px solid var(--border-subtle);
      gap: 0.25rem;
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-2);
      font-family: var(--font-sans);
      font-size: 0.825rem;
      font-weight: 600;
      padding: 0.5rem 1.15rem;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s ease;
    }

    .nav-tab-btn:hover {
      color: var(--text-1);
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }

    /* Container */
    .showcase-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* =======================================================
       SLIDE DECK PRESENTATION MODE
       ======================================================= */
    .slide-deck-wrapper {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      min-height: 680px;
      display: flex;
      flex-direction: column;
    }

    .slide-progress-bar {
      height: 4px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .slide-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .slide-meta-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(6, 182, 212, 0.12);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(6, 182, 212, 0.25);
    }

    .slide-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-top: 0.4rem;
      background: linear-gradient(135deg, #ffffff 50%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slide-content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-subtle);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-2);
    }

    .slide-btn {
      background: var(--bg-card-hover);
      color: var(--text-1);
      border: 1px solid var(--border-subtle);
      padding: 0.65rem 1.4rem;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .slide-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .slide-btn.btn-accent {
      background: var(--primary);
      border-color: var(--primary-hover);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }

    .slide-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Slide Cards Grid */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.75rem;
    }

    .grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .feature-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      transition: all 0.25s ease;
    }

    .feature-card:hover {
      border-color: var(--border-glow);
      background: rgba(15, 23, 42, 0.85);
      transform: translateY(-3px);
      box-shadow: var(--shadow-glow);
    }

    .feature-icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a5b4fc;
      margin-bottom: 1.25rem;

    .feature-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.5rem;

    }

    .feature-card p {
      font-size: 0.9rem;
      color: var(--text-2);
      line-height: 1.55;
    }

    .feature-badge {

      margin-top: 1rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      padding: 0.25rem 0.6rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      color: #93c5fd;
    }

    /* Architecture diagram box */
    .arch-flow-box {
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .flow-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .flow-node {
      flex: 1;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 1rem;
      text-align: center;
      transition: all 0.2s ease;
    }

    .flow-node:hover {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }

    .flow-node-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
    }

    .flow-node-sub {
      font-size: 0.75rem;
      color: var(--text-2);
      font-family: var(--font-mono);
      margin-top: 0.25rem;
    }

    .flow-arrow {
      color: var(--accent);
      font-size: 1.25rem;
      font-weight: 800;
    }

    /* =======================================================
       CODE EXPLORER TAB
       ======================================================= */
    .code-explorer-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);

      min-height: 680px;
    }

    .file-sidebar {
      background: rgba(11, 15, 25, 0.7);

      font-size: 0.75rem;

      text-transform: uppercase;

      display: flex;
      align-items: center;

      border: none;

      font-family: var(--font-mono);
      font-size: 0.825rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;

    .file-tree-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-1);
    }

    .file-tree-item.active {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
      font-weight: 600;
    }

    .file-viewer-main {
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .file-viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .file-viewer-title-group h2 {
      font-size: 1.2rem;
      font-family: var(--font-mono);
      color: #fff;
    }

    .file-viewer-title-group p {
      font-size: 0.825rem;
      color: var(--text-2);
      margin-top: 2px;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid var(--border-subtle);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-family: var(--font-sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;

    .copy-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .code-editor-box {
      background: #060911;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow-y: auto;
      max-height: 580px;
      padding: 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
      color: #e2e8f0;

      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(6, 182, 212, 0.15));

    .demo-blog-card {

    .demo-card-media img, .demo-card-media iframe {

    .demo-card-word-count {

    .demo-card-title {
      font-size: 1.1rem;
      font-weight: 700;

      margin-bottom: 0.5rem;
      line-height: 1.35;
    }

    .demo-card-text {
      font-size: 0.85rem;

      line-height: 1.5;
      margin-bottom: 1rem;

    }

    .demo-card-actions {
      display: flex;
      border-top: 1px solid var(--border-subtle);
      padding: 0.5rem 0.75rem;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.25);
    }

    .demo-action-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-2);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.4rem;
      border-radius: 4px;

    .demo-action-btn:hover {

    .demo-action-btn.btn-delete:hover {

    .demo-form-box {

    .badge-danger {

    }

    .banner-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);

      padding: 0.75rem 1rem;

    @media (max-width: 900px) {
      .grid-2col, .grid-3col, .code-explorer-layout {
        grid-template-columns: 1fr;
      }
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>

  "blogs": [

      },
      {
        path: "src/api/blogService.js",
        category: "API Service Layer",
        summary: "Centralized Axios instance & REST methods: getAll, getById, create, update, remove",
        code: `import axios from 'axios';

const API_BASE_URL = 'http://localhost:5000/blogs';

const apiClient = axios.create({
  baseURL: API_BASE_URL,
  headers: { 'Content-Type': 'application/json' },
  timeout: 5000,
});

export const blogService = {
  async getAll(search = '') {
    const url = search ? \`?q=\${encodeURIComponent(search)}\` : '';
    const res = await apiClient.get(url);
    return res.data;
  },
  async getById(id) {
    const res = await apiClient.get(\`/\${id}\`);
    return res.data;
  },
  async create(blogData) {
    const payload = { ...blogData, createdAt: new Date().toISOString() };
    const res = await apiClient.post('', payload);
    return res.data;
  },
  async update(id, blogData) {
    const res = await apiClient.put(\`/\${id}\`, blogData);
    return res.data;
  },
  async remove(id) {
    await apiClient.delete(\`/\${id}\`);
    return true;
  }
};

export default blogService;`

 * Custom hook to calculate word count and enforce the 1,000-word constraint.
 */
export function useWordCount(text = '', maxWords = 1000) {
  return useMemo(() => {
    if (!text || typeof text !== 'string') {
      return { wordCount: 0, isOverLimit: false, excessWords: 0, percentage: 0, remainingWords: maxWords };
    }

    const trimmed = text.trim();
    const words = trimmed ? trimmed.split(/\\s+/).filter(Boolean) : [];
    const count = words.length;
    const isOver = count > maxWords;
    const excess = isOver ? count - maxWords : 0;
    const remaining = isOver ? 0 : maxWords - count;
    const percentage = Math.min(100, Math.round((count / maxWords) * 100));

    return {
      wordCount: count,
      isOverLimit: isOver,
      excessWords: excess,
      percentage,
      remainingWords: remaining,
      isValid: !isOver && count > 0
    };
  }, [text, maxWords]);
}

export default useWordCount;`

import blogService from '../api/blogService';

export function useBlogs() {
  const [blogs, setBlogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');

  const loadBlogs = useCallback(async (query = searchQuery) => {
    setLoading(true);
    setError(null);
    try {
      const data = await blogService.getAll(query);
      setBlogs(data);
    } catch (err) {
      setError(err.message || 'Failed to fetch blogs from json-server.');
    } finally {
      setLoading(false);
    }
  }, [searchQuery]);

  useEffect(() => {
    const timer = setTimeout(() => {
      loadBlogs(searchQuery);
    }, 250);
    return () => clearTimeout(timer);
  }, [searchQuery, loadBlogs]);

  const addBlog = async (newBlog) => {
    const created = await blogService.create(newBlog);
    setBlogs(prev => [created, ...prev]);
    return created;
  };

  const editBlog = async (id, updated) => {
    const res = await blogService.update(id, updated);
    setBlogs(prev => prev.map(b => (String(b.id) === String(id) ? res : b)));
    return res;
  };

  const deleteBlog = async (id) => {
    await blogService.remove(id);
    setBlogs(prev => prev.filter(b => String(b.id) !== String(id)));
  };

  return { blogs, loading, error, searchQuery, setSearchQuery, loadBlogs, addBlog, editBlog, deleteBlog };
}

export default useBlogs;`

        navigator.clipboard.writeText(PROJECT_FILES[selectedFileIndex].code);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div>
          {/* Header */}
          <header className="showcase-header">
            <div className="header-inner">
              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                <span className="badge-pill">CRUD Studio</span>
                <div className="header-title-box">
                  <h1>Blog Studio (CRUD Architecture)</h1>
                  <p>React.js • Axios • Mock JSON Server • 1,000-Word Constraint • Media Viewer</p>
                </div>
              </div>

              {/* Tabs */}
              <nav className="nav-tabs">
                <button
                  className={`nav-tab-btn ${activeTab === 'slides' ? 'active' : ''}`}
                  onClick={() => setActiveTab('slides')}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                  Presentation Deck
                </button>

                <button
                  className={`nav-tab-btn ${activeTab === 'demo' ? 'active' : ''}`}
                  onClick={() => setActiveTab('demo')}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  Interactive Live App
                </button>

                <button
                  className={`nav-tab-btn ${activeTab === 'files' ? 'active' : ''}`}
                  onClick={() => setActiveTab('files')}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                  Code Explorer ({PROJECT_FILES.length} Files)
                </button>
              </nav>
            </div>
          </header>

          {/* Main Showcase Container */}
          <main className="showcase-container">
            {/* TAB 1: PRESENTATION SLIDE DECK */}
            {activeTab === 'slides' && (
              <section className="slide-deck-wrapper">
                {/* Progress */}
                <div className="slide-progress-bar">
                  <div
                    className="slide-progress-fill"
                    style={{ width: `${((currentSlide + 1) / SLIDES.length) * 100}%` }}
                  />
                </div>

                {/* Slide Header */}
                <div className="slide-header">
                  <div>
                    <span className="slide-meta-tag">{SLIDES[currentSlide].tag}</span>
                    <h2 className="slide-title">{SLIDES[currentSlide].title}</h2>
                    <p style={{ color: 'var(--text-2)', fontSize: '0.95rem', marginTop: '4px' }}>
                      {SLIDES[currentSlide].subtitle}
                    </p>
                  </div>
                </div>

                {/* Slide Content Body */}
                <div className="slide-content-area">
                  {SLIDES[currentSlide].render()}
                </div>

                {/* Footer Navigation */}
                <div className="slide-footer-nav">
                  <span className="slide-counter">
                    Slide {currentSlide + 1} of {SLIDES.length}
                  </span>

                  <div style={{ display: 'flex', gap: '0.75rem' }}>
                    <button
                      className="slide-btn"
                      disabled={currentSlide === 0}
                      onClick={() => setCurrentSlide(prev => prev - 1)}
                    >
                      ← Previous
                    </button>
                    {currentSlide < SLIDES.length - 1 ? (
                      <button
                        className="slide-btn btn-accent"
                        onClick={() => setCurrentSlide(prev => prev + 1)}
                      >
                        Next Slide →
                      </button>
                    ) : (
                      <button
                        className="slide-btn btn-accent"
                        onClick={() => setActiveTab('demo')}
                      >
                        Launch Live App Demo →
                      </button>
                    )}
                  </div>
                </div>
              </section>
            )}

            {/* TAB 2: INTERACTIVE LIVE WORKING BLOG APP */}
            {activeTab === 'demo' && (
              <section className="live-demo-card">
                <div className="live-demo-banner">
                  <div>
                    <h2 style={{ fontSize: '1.25rem', fontWeight: 800 }}>Live React Application Simulation</h2>
                    <p style={{ fontSize: '0.85rem', color: 'var(--text-2)' }}>
                      Test all CRUD features, 1,000-word constraint tokenizer, YouTube media embeds, and instant keyword search directly below!
                    </p>
                  </div>
                  <button
                    className="slide-btn btn-accent"
                    onClick={() => {
                      setIsAdding(!isAdding);
                      setEditingId(null);
                      setDemoTitle('');
                      setDemoImage('');
                      setDemoVideo('');
                      setDemoContent('');
                    }}
                  >
                    {isAdding ? 'Close Form' : '+ Create New Post'}
                  </button>
                </div>

                {/* Form Box */}
                {isAdding && (
                  <form className="demo-form-box" onSubmit={handleSaveBlog}>
                    <h3 style={{ marginBottom: '1.25rem', fontSize: '1.2rem' }}>
                      {editingId ? 'Edit Blog Post' : 'Compose New Blog Post'}
                    </h3>

                    <input
                      className="demo-input"
                      type="text"
                      placeholder="Article Title *"
                      value={demoTitle}
                      onChange={e => setDemoTitle(e.target.value)}
                      required
                    />

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                      <input
                        className="demo-input"
                        type="url"
                        placeholder="Image URL (e.g., https://picsum.photos/seed/tech/800/400)"
                        value={demoImage}
                        onChange={e => setDemoImage(e.target.value)}
                      />
                      <input
                        className="demo-input"
                        type="url"
                        placeholder="Video Embed URL (YouTube/MP4)"
                        value={demoVideo}
                        onChange={e => setDemoVideo(e.target.value)}
                      />
                    </div>

                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                      <label style={{ fontSize: '0.85rem', fontWeight: 600 }}>Post Content *</label>
                      <span className={`demo-word-badge ${demoIsOverLimit ? 'badge-danger' : 'badge-ok'}`}>
                        {demoWordCount} / 1,000 words
                      </span>
                    </div>

                    <textarea
                      className="demo-textarea"
                      placeholder="Write your article body... Word count is calculated on keystroke."
                      value={demoContent}
                      onChange={e => setDemoContent(e.target.value)}
                      required
                    />

                    {demoIsOverLimit && (
                      <div className="banner-danger">
                        <strong>Constraint Exceeded:</strong> Content exceeds 1,000 words ceiling by {demoExcess} words! The submit button has been disabled.
                      </div>
                    )}

                    <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.75rem' }}>
                      <button
                        type="button"
                        className="slide-btn"
                        onClick={() => setIsAdding(false)}
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="slide-btn btn-accent"
                        disabled={demoIsOverLimit || !demoTitle.trim() || !demoContent.trim()}
                      >
                        {editingId ? 'Save Changes' : 'Publish to REST API'}
                      </button>
                    </div>
                  </form>
                )}

                {/* Search Bar */}
                <div style={{ marginBottom: '1.75rem', display: 'flex', gap: '1rem', alignItems: 'center' }}>
                  <input
                    type="text"
                    className="demo-input"
                    style={{ margin: 0 }}
                    placeholder="Search posts by title or keyword..."
                    value={demoSearch}
                    onChange={e => setDemoSearch(e.target.value)}
                  />
                  {demoSearch && (
                    <button
                      className="slide-btn"
                      onClick={() => setDemoSearch('')}
                    >
                      Clear
                    </button>
                  )}
                  <span style={{ fontSize: '0.85rem', color: 'var(--text-2)', whiteSpace: 'nowrap' }}>
                    {filteredBlogs.length} {filteredBlogs.length === 1 ? 'post' : 'posts'}
                  </span>
                </div>

                {/* Grid */}
                {filteredBlogs.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '3rem', color: 'var(--text-3)' }}>
                    No blog posts match your criteria.
                  </div>
                ) : (
                  <div className="demo-grid">
                    {filteredBlogs.map(blog => (
                      <article key={blog.id} className="demo-blog-card">
                        <div className="demo-card-media" onClick={() => setReadingBlog(blog)} style={{ cursor: 'pointer' }}>
                          {blog.videoUrl ? (
                            <iframe
                              src={blog.videoUrl.includes('embed') ? blog.videoUrl : `https://www.youtube.com/embed/${(blog.videoUrl.match(/(?:watch\?v=|youtu\.be\/)([^&]+)/) || [])[1] || ''}`}
                              title={blog.title}
                              allowFullScreen
                            />
                          ) : (
                            <img src={blog.imageUrl} alt={blog.title} />
                          )}
                        </div>

                        <div className="demo-card-body">
                          <div className="demo-card-meta">
                            <span>{new Date(blog.createdAt).toLocaleDateString()}</span>
                            <span className="demo-card-word-count">{blog.wordCount || 0} words</span>
                          </div>
                          <h4 className="demo-card-title">{blog.title}</h4>
                          <p className="demo-card-text">{blog.content.substring(0, 140)}...</p>
                        </div>

                        <div className="demo-card-actions">
                          <button className="demo-action-btn" onClick={() => setReadingBlog(blog)}>Read</button>
                          <button className="demo-action-btn" onClick={() => startEdit(blog)}>Edit</button>
                          <button className="demo-action-btn btn-delete" onClick={() => deleteBlog(blog.id)}>Delete</button>
                        </div>
                      </article>
                    ))}
                  </div>
                )}

                {/* Reader Modal */}
                {readingBlog && (
                  <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.8)', backdropFilter: 'blur(8px)', zIndex: 2000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1.5rem' }}>
                    <div style={{ background: '#131b2e', border: '1px solid var(--border-subtle)', borderRadius: '20px', maxWidth: '700px', width: '100%', maxHeight: '90vh', overflowY: 'auto', padding: '2rem' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
                        <span className="demo-word-badge badge-ok">{readingBlog.wordCount} words</span>
                        <button className="slide-btn" onClick={() => setReadingBlog(null)}>✕ Close</button>
                      </div>

                      {readingBlog.videoUrl && (
                        <div style={{ aspectRatio: '16/9', marginBottom: '1.5rem' }}>
                          <iframe
                            src={readingBlog.videoUrl}
                            style={{ width: '100%', height: '100%', border: 'none', borderRadius: '12px' }}
                            allowFullScreen
                          />
                        </div>
                      )}

                      <h2 style={{ fontSize: '1.6rem', marginBottom: '1rem', color: '#fff' }}>{readingBlog.title}</h2>
                      <p style={{ color: '#cbd5e1', lineHeight: '1.8', whiteSpace: 'pre-line' }}>{readingBlog.content}</p>

                      <div style={{ marginTop: '2rem', display: 'flex', justifyContent: 'flex-end', gap: '0.75rem' }}>
                        <button className="slide-btn" onClick={() => { startEdit(readingBlog); setReadingBlog(null); }}>Edit Post</button>
                        <button className="slide-btn btn-accent" onClick={() => setReadingBlog(null)}>Done Reading</button>
                      </div>
                    </div>
                  </div>
                )}
              </section>
            )}

            {/* TAB 3: CODE & FILE EXPLORER */}
            {activeTab === 'files' && (
              <section className="code-explorer-layout">
                {/* File Sidebar */}
                <aside className="file-sidebar">
                  <div className="file-group-title">Project Structure (Assignment 9)</div>
                  {PROJECT_FILES.map((file, idx) => (
                    <button
                      key={file.path}
                      className={`file-tree-item ${selectedFileIndex === idx ? 'active' : ''}`}
                      onClick={() => setSelectedFileIndex(idx)}
                    >
                      <span>{file.path}</span>
                    </button>
                  ))}
                </aside>

                {/* File Viewer Main */}
                <main className="file-viewer-main">
                  <div className="file-viewer-header">
                    <div className="file-viewer-title-group">
                      <h2>{PROJECT_FILES[selectedFileIndex].path}</h2>
                      <p>{PROJECT_FILES[selectedFileIndex].summary}</p>
                    </div>

                    <button className="copy-btn" onClick={handleCopyCode}>
                      {copied ? '✓ Copied!' : 'Copy File Content'}
                    </button>
                  </div>

                  <div className="code-editor-box">
                    {PROJECT_FILES[selectedFileIndex].code}
                  </div>
                </main>
              </section>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('presentation-root')).render(<PresentationApp />);
  </script>
</body>
</html>
